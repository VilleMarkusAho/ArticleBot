version: '3.9'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    ports:
      - "3000:3000"
    volumes:
      - ./UI:/app/frontend
      - /app/frontend/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
      - HOST=0.0.0.0

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend
    ports:
      - "5000:5000"
    volumes:
      - ./Backend:/app/backend
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=development